name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, build, and scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install lint dependencies
        run: python -m pip install --disable-pip-version-check yamllint PyYAML

      - name: Set up Helm for chart linting
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: 2. Lint project files
        run: python checks/check_project.py

      - name: 3. Run unit tests
        run: python -m unittest discover --start-directory tests --pattern 'test_*.py' --verbose

      - name: 4. Build container image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker build --tag self-healing-demo:${IMAGE_TAG} .

      - name: 5. Scan built image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: self-healing-demo:${{ github.sha }}
          scanners: vuln,secret
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Save scanned image for publishing
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: docker save "self-healing-demo:${GITHUB_SHA}" --output /tmp/self-healing-demo.tar

      - name: Upload scanned image
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: scanned-image
          path: /tmp/self-healing-demo.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Push image and update GitOps
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 6. Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download scanned image
        uses: actions/download-artifact@v4
        with:
          name: scanned-image
          path: /tmp/scanned-image

      - name: Load scanned image
        run: docker load --input /tmp/scanned-image/self-healing-demo.tar

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Ensure ECR repository exists
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          test -n "$REPOSITORY" || { echo 'Set the ECR_REPOSITORY variable.'; exit 1; }
          if REPOSITORY_INFO="$(aws ecr describe-repositories --repository-names "$REPOSITORY" --region "$REGION" 2>&1)"; then
            echo "ECR repository '$REPOSITORY' already exists."
          elif grep -q 'RepositoryNotFoundException' <<< "$REPOSITORY_INFO"; then
            echo "ECR repository '$REPOSITORY' is missing; creating it."
            if ! aws ecr create-repository \
              --repository-name "$REPOSITORY" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 \
              --region "$REGION"; then
              aws ecr describe-repositories --repository-names "$REPOSITORY" --region "$REGION" >/dev/null
            fi
          else
            echo "$REPOSITORY_INFO"
            exit 1
          fi

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 7. Push SHA and latest tags to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker tag "self-healing-demo:${IMAGE_TAG}" "${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"
          docker tag "self-healing-demo:${IMAGE_TAG}" "${REGISTRY}/${REPOSITORY}:latest"
          docker push "${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"
          docker push "${REGISTRY}/${REPOSITORY}:latest"

      - name: 8. Update image tag in the GitOps branch
        env:
          IMAGE_REPOSITORY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML
          cp .github/scripts/update_image.py /tmp/update_image.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gitops
          git checkout -B gitops origin/gitops
          IMAGE_REPOSITORY="$IMAGE_REPOSITORY" python /tmp/update_image.py "$IMAGE_TAG"
          git add helm/app/values.yaml
          if git diff --cached --quiet; then
            echo 'GitOps values already point at this image.'
          else
            git commit -m "deploy: self-healing-demo ${IMAGE_TAG}"
            git push origin HEAD:gitops
          fi
          echo 'Argo CD will detect the GitOps commit and reconcile the Helm chart.' >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${IMAGE_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
