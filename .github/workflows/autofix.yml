name: AI Autofix PR

on:
  workflow_run:
    workflows: [CI, CD]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_file:
        description: Optional allowlisted file for a manual repair attempt
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  propose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.repository.default_branch || github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - name: Fetch failed source revision without executing it
        if: github.event_name == 'workflow_run'
        env:
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: git fetch --no-tags origin "$FAILED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Gemini SDK and checker dependencies
        run: python -m pip install --disable-pip-version-check google-genai yamllint PyYAML

      - name: Set up Helm for chart validation
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Diagnose failure, validate suggestion, and open review PR
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
          BASE_BRANCH: main
          TARGET_FILE: ${{ inputs.target_file }}
        run: python .github/scripts/autofix.py
