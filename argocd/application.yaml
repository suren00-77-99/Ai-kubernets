apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: self-healing-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_WITH_OWNER/REPLACE_WITH_REPO.git
    targetRevision: gitops
    path: helm/app
    helm:
      releaseName: self-healing-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: self-healing-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
