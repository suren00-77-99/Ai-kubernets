apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: self-healing-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/suren00-77-99/Ai-kubernets.git
    targetRevision: gitops
    path: helm/app
    helm:
      releaseName: self-healing-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: self-healing-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
